name: Tests

# Runs automatically on GitHub's own servers every time code is pushed
# or a pull request is opened - no local Node.js/terminal needed at
# all. Check the "Actions" tab on GitHub, or the checkmark/X that
# appears next to each commit, to see the result.

on:
  push:
    branches: [Test-Branch, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
